[project]
name = "cart"
version = "0.1.0"
description = "In-memory shopping cart API"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "mypy", "mutmut<3", "import-linter", "pip-audit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".rig", ".claude"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
exclude = ["^\\.rig/", "^\\.claude/", "^\\.venv/"]
